name: Dividendenatlas taeglicher Scan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan ausfuehren
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 scan_dividends.py

      - name: Ergebnis zurueck ins Repo committen
        run: |
          git config user.name "Dividendenatlas Bot"
          git config user.email "actions@github.com"
          git add history.json dividendenatlas.html dividendenatlas.log
          git diff --staged --quiet || git commit -m "Automatischer Scan"
          git push
